<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>islamic tap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="user-badge">
      <span class="user-avatar" id="user-avatar">?</span>
      <span class="user-name" id="user-name">Guest</span>
    </div>
  </header>

  <main class="stage">
    <div class="score">
      <span class="score-value" id="score">0</span>
      <span class="score-label">RIDAN</span>
    </div>

    <button class="coin" id="coin" aria-label="tap">
      <span class="coin-emoji">💩</span>
    </button>

    <div class="food">
      <div class="food-bar">
        <div class="food-fill" id="food-fill"></div>
      </div>
      <span class="food-text" id="food-text">🍔 500 / 500</span>
    </div>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js"></script>
</body>
</html>
