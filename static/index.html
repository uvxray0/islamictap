<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>islamic tap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/panels.css" />
  <link rel="stylesheet" href="css/modals.css" />
</head>
<body>
  <div class="tips-overlay" id="tips-overlay">
    <div class="tips-modal">
      <div class="tips-icon">⚠️</div>
      <h2 data-i18n="tips_title">توجه!</h2>
      <p data-i18n="tips_text">این پروژه موقتی است، حاوی هیچ ارز واقعی نیست، در مرحله توسعه و تست است، و پایداری لازم را ندارد. ممنون که در آزمایش آن هستید!</p>
      <button class="tips-button" id="tips-ok" data-i18n="tips_ok">باشه</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="donate-overlay" id="donate-overlay">
    <div class="donate-modal">
      <h2 id="donate-title" data-i18n="donate">اهدا</h2>
      <p class="donate-balance" id="donate-balance">موجودی: 0</p>
      <input type="number" id="donate-input" min="1" data-i18n-placeholder="donate_amount" placeholder="مقدار اهدا" />
      <div class="donate-actions">
        <button class="donate-cancel" id="donate-cancel" data-i18n="cancel">لغو</button>
        <button class="donate-confirm" id="donate-confirm" data-i18n="confirm">تأیید</button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="user-badge">
      <span class="user-avatar" id="user-avatar">?</span>
      <span class="user-name" id="user-name">Guest</span>
    </div>
    <div class="topbar-right">
      <span class="speed-badge" id="speed-display">🍔 2/s</span>
      <span class="gems-badge" id="gems">💎 0</span>
      <button class="lang-switch" id="lang-switch">EN</button>
    </div>
  </header>

  <main class="stage">
    <div class="score">
      <span class="score-value" id="score">0</span>
      <span class="score-label" data-i18n="score_label">RIDAN</span>
    </div>

    <button class="coin" id="coin" aria-label="tap">
      <span class="coin-emoji">💩</span>
    </button>

    <div class="food">
      <div class="food-bar"><div class="food-fill" id="food-fill"></div></div>
      <span class="food-text" id="food-text">🍔 500 / 500</span>
    </div>
  </main>

  <nav class="bottombar">
    <button class="tab active" data-tab="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label" data-i18n="tab_home">خانه</span>
    </button>
    <button class="tab" data-tab="shop">
      <span class="tab-icon">🛒</span>
      <span class="tab-label" data-i18n="tab_shop">فروشگاه</span>
    </button>
    <button class="tab" data-tab="referral">
      <span class="tab-icon">👥</span>
      <span class="tab-label" data-i18n="tab_referral">دعوت</span>
    </button>
    <button class="tab" data-tab="stats">
      <span class="tab-icon">📊</span>
      <span class="tab-label" data-i18n="tab_stats">آمار</span>
    </button>
  </nav>

  <div class="shop-panel" id="shop-panel">
    <div class="shop-header"><h2 data-i18n="shop_title">🛒 فروشگاه</h2></div>
    <div class="shop-body">
      <div class="shop-section">
        <h3 class="shop-section-title" data-i18n="shop_upgrades_title">⬆️ ارتقاها</h3>
        <div class="shop-upgrades" id="shop-upgrades"></div>
      </div>
      <div class="shop-section">
        <h3 class="shop-section-title" data-i18n="shop_heroes_title">🦸 قهرمان‌ها</h3>
        <div class="shop-upgrades" id="shop-heroes"></div>
      </div>
      <div class="shop-section">
        <h3 class="shop-section-title" data-i18n="shop_chars_title">👹 شخصیت ها</h3>
        <div class="shop-grid" id="shop-grid"></div>
      </div>
    </div>
  </div>

  <div class="referral-panel" id="referral-panel">
    <div class="referral-header"><h2 data-i18n="tab_referral">👥 دعوت</h2></div>
    <div class="referral-body">
      <div class="referral-stats">
        <div class="referral-stat">
          <span class="referral-stat-label" data-i18n="referrals">دعوت‌ها</span>
          <span class="referral-stat-value" id="ref-count">0</span>
        </div>
        <div class="referral-stat">
          <span class="referral-stat-label" data-i18n="gems">الماس</span>
          <span class="referral-stat-value" id="ref-gems">0</span>
        </div>
      </div>
      <div class="referral-link-section">
        <div class="referral-link-label" data-i18n="your_link">لینک دعوت شما</div>
        <div class="referral-link-box">
          <input type="text" id="ref-link" readonly />
          <button id="ref-copy" data-i18n="copy">کپی</button>
        </div>
      </div>
    </div>
  </div>

  <div class="stats-panel" id="stats-panel">
    <div class="stats-header"><h2 data-i18n="leaderboard_title">🏆 برترین‌ها</h2></div>
    <div class="stats-list" id="stats-list"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/state.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/referral.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
